services:
  frm:
    build:
      context: ../../..
      dockerfile: packages/agent/frm/Dockerfile
      target: production
    image: frm:0.0.1
    container_name: frm
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # For local development: use local storage directory
      - ./storage:/opt/frm/packages/agent/frm/storage
      # For production: uncomment this and run ./setup-docker-host.sh first
      # - /var/lib/frm:/opt/frm/packages/agent/frm/storage
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    stop_signal: SIGINT
