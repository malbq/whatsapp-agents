services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: batman-postgres
    restart: on-failure:5
    environment:
      - POSTGRES_DB=batman
      - POSTGRES_USER=batman
      - POSTGRES_PASSWORD=batman
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batman -d batman"]
      interval: 10s
      timeout: 5s
      retries: 5

  zapid:
    build:
      context: .
      target: production
    image: zapid:0.4.53
    container_name: zapid
    restart: on-failure:5
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://batman:batman@postgres:5432/batman
    volumes:
      - /var/lib/zapid:/opt/zapid/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    stop_signal: SIGINT

volumes:
  postgres_data:
